<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title">
  <title id="title">Sovereign Forge Exact Witness Verification Kernel</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050912"/>
      <stop offset="50%" stop-color="#081426"/>
      <stop offset="100%" stop-color="#02050B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD77A"/>
      <stop offset="50%" stop-color="#D6A84B"/>
      <stop offset="100%" stop-color="#7E5921"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#28405A" stroke-opacity="0.15" stroke-width="1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .title { font-size: 48px; font-weight: 800; letter-spacing: 6px; fill: #F3F7FF; }
      .subtitle { font-size: 16px; letter-spacing: 3px; fill: #D6A84B; }
      .label { font-size: 14px; font-weight: 700; fill: #F3F7FF; }
      .eq { font-size: 20px; font-weight: 700; fill: #F3F7FF; }
      .cap { font-size: 13px; letter-spacing: 2px; fill: #7F91A8; }
      .pass { fill: #68F5A2; }
      .fail { fill: #FFB454; }
    </style>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>
  <text x="800" y="50" text-anchor="middle" class="mono title">SOVEREIGN FORGE</text>
  <text x="800" y="75" text-anchor="middle" class="mono subtitle">EXACT WITNESS VERIFICATION</text>
  
  <!-- Left: Input -->
  <rect x="50" y="130" width="280" height="220" rx="12" fill="#081426" stroke="#28405A" stroke-width="2"/>
  <text x="190" y="160" text-anchor="middle" class="mono label">UNTRUSTED COMPUTE</text>
  <rect x="70" y="180" width="240" height="44" rx="8" fill="#102947" stroke="#4DE4FF" stroke-width="2"/>
  <text x="190" y="205" text-anchor="middle" class="mono cap">result + witness</text>
  <rect x="70" y="240" width="240" height="44" rx="8" fill="#102947" stroke="#4DE4FF" stroke-width="2"/>
  <text x="190" y="265" text-anchor="middle" class="mono cap">program hash</text>
  <rect x="70" y="300" width="240" height="44" rx="8" fill="#102947" stroke="#4DE4FF" stroke-width="2"/>
  <text x="190" y="325" text-anchor="middle" class="mono cap">dimensions</text>
  
  <!-- Arrows in -->
  <g filter="url(#glow)" opacity="0.8">
    <path d="M 330 160 L 400 180" stroke="#4DE4FF" stroke-width="3" fill="none"/>
    <path d="M 330 262 L 400 280" stroke="#4DE4FF" stroke-width="3" fill="none"/>
    <path d="M 330 340 L 400 360" stroke="#4DE4FF" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Center: Kernel -->
  <polygon points="500,130 800,100 1100,130 1120,280 800,310 480,280" fill="#15385B" stroke="url(#gold)" stroke-width="3" filter="url(#glow)"/>
  <text x="800" y="160" text-anchor="middle" class="mono label" fill="#FFD77A">SOVEREIGN FORGE</text>
  <text x="800" y="190" text-anchor="middle" class="mono cap" fill="#D6A84B">EXACT KERNEL</text>
  <text x="600" y="230" text-anchor="middle" class="mono eq">A × X = I</text>
  <text x="800" y="230" text-anchor="middle" class="mono eq">A × x = b</text>
  <text x="1000" y="230" text-anchor="middle" class="mono eq">Aᵀ(Ax−b) = 0</text>
  
  <!-- Arrows out -->
  <g filter="url(#glow)" opacity="0.8">
    <path d="M 1200 180 L 1270 180" stroke="#4DE4FF" stroke-width="3" fill="none"/>
    <path d="M 1200 280 L 1270 280" stroke="#4DE4FF" stroke-width="3" fill="none"/>
    <path d="M 1200 360 L 1270 360" stroke="#4DE4FF" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Right: Output -->
  <rect x="1270" y="130" width="280" height="220" rx="12" fill="#081426" stroke="#28405A" stroke-width="2"/>
  <text x="1410" y="160" text-anchor="middle" class="mono label">VERIFIED RESULT</text>
  
  <rect x="1290" y="160" width="240" height="54" rx="8" fill="#0A1820" stroke="#68F5A2" stroke-width="2"/>
  <text x="1410" y="185" text-anchor="middle" class="mono pass" style="font-size:14px;font-weight:700">✓ PASS</text>
  <text x="1410" y="205" text-anchor="middle" class="mono cap">invariant holds</text>
  
  <rect x="1290" y="240" width="240" height="54" rx="8" fill="#1A1410" stroke="#FFB454" stroke-width="2"/>
  <text x="1410" y="265" text-anchor="middle" class="mono fail" style="font-size:14px;font-weight:700">✗ FAIL</text>
  <text x="1410" y="285" text-anchor="middle" class="mono cap">invariant broken</text>
  
  <rect x="1290" y="320" width="240" height="54" rx="8" fill="#15140A" stroke="#E260FF" stroke-width="2"/>
  <text x="1410" y="345" text-anchor="middle" class="mono fail" style="font-size:14px;font-weight:700">⚠ OVERFLOW</text>
  <text x="1410" y="365" text-anchor="middle" class="mono cap">arithmetic error</text>
  
  <!-- Bottom capabilities -->
  <line x1="100" y1="500" x2="1500" y2="500" stroke="#D6A84B" stroke-opacity="0.3" stroke-width="1"/>
  <text x="200" y="525" class="mono cap">INT64 EXACT</text>
  <text x="500" y="525" class="mono cap">CHECKED OVERFLOW</text>
  <text x="850" y="525" class="mono cap">DETERMINISTIC</text>
  <text x="1200" y="525" class="mono cap">ZERO EPSILON</text>
</svg>
